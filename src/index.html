<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Post-it Board</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-light">
  <div class="container py-4">
    <h1 class="text-center mb-4 fw-bold text-dark">📝 Post-it ToDo List - Board</h1>

    <div class="d-flex justify-content-center align-items-center gap-2 mb-4 flex-wrap">
      <input id="group-name" type="text" class="form-control w-auto" placeholder="Group name" />
      <select id="group-color" class="form-select w-auto">
        <option value="#F4A7B9" style="background-color: #F4A7B9;">Pink</option>
        <option value="#FBE1A0" style="background-color: #FBE1A0;">Peach</option>
        <option value="#C7E6E0" style="background-color: #C7E6E0;">Mint</option>
        <option value="#B6E1E9" style="background-color: #B6E1E9;">Blue</option>
        <option value="#C8B6E2" style="background-color: #C8B6E2;">Lilac</option>
      </select>
      <button id="add-group" class="btn btn-dark">Add Group</button>
    </div>

    <div id="board" class="board"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
